","저도요. 다음에 시간 맞으면 또 뵈어요~"],["2022.04.16 10:12","최지우","좋은 아침이에요! 오늘 몇 시에 만날까요?"],["2022.04.16 11:24","이강헌","2시 어떠세요? 늦지 않게 갈게요."],["2022.04.16 11:25","최지우","좋아요ㅎㅎ"],["2022.06.13 12:08","최지우","점심 먹었어?"],["2022.06.13 12:09","최지우","뭐 먹었는데"],["2022.06.13 14:14","이강헌","국밥 먹었어~ 너는?"],["2022.06.13 14:15","최지우","ㅋㅋㅋ 또 국밥이야?"],["2022.06.13 15:17","이강헌","맛있잖아. 다음엔 같이 가자."],["2022.09.24 20:03","최지우","나 오늘 옷 샀어"],["2022.09.24 20:04","최지우","사진 보낼까?"],["2022.09.24 21:31","이강헌","보여 줘~"],["2022.09.24 21:32","최지우","[사진] 새로 산 코트"],["2022.09.24 22:35","이강헌","예쁘네. 색도 잘 어울려."],["2022.12.25 09:21","최지우","메리 크리스마스 ❤️"],["2022.12.25 09:21","최지우","오늘 볼 수 있지?"],["2022.12.25 12:12","이강헌","지우야 미안. 오늘 갑자기 일이 생겼어."],["2022.12.25 12:14","최지우","또?"],["2022.12.25 13:15","이강헌","다음에 내가 맛있는 거 사줄게. 미안해."],["2023.02.18 01:41","이강헌","일이 좀 많았어. 걱정하게 해서 미안해."],["2023.02.18 01:43","최지우","나랑 얘기 좀 해"],["2023.02.18 23:14","최지우","요즘 왜 이렇게 연락이 안 돼?"],["2023.02.18 23:18","최지우","무슨 일 있어?"],["2023.03.09 00:40","이강헌","네 잘못 아니야. 내가 계속 기다리게만 하잖아."],["2023.03.09 00:41","이강헌","미안해."],["2023.03.09 00:45","최지우","그걸 이제 말하면 어떡해"],["2023.03.09 21:12","최지우","내가 뭘 잘못했어?"],["2023.03.09 21:20","최지우","그럼 왜 자꾸 피하는데"],["2023.03.09 23:29","이강헌","지우야. 우리 그만 만나자."],["2023.03.09 23:32","최지우","갑자기? 이유는 말해줘야지"]]},{"id":"lee","name":"이강헌","group":"알 수 없는 연락처","messages":[["2024.10.19 02:13","최요원","이강헌"]]},{"id":"number1","name":"알 수 없는 연락처","group":"알 수 없는 연락처","messages":[["2020.08.14 09:21","박도현","선배님 저 박도현입니다!"],["2020.08.14 09:22","박도현","번호 저장 부탁드립니다"],["2020.08.14 09:25","최요원","어 그래~"],["2020.08.14 09:26","최요원","내일 늦지 말고"],["2020.08.14 09:27","박도현","넵!"],["2021.04.08 18:12","박도현","선배님 내일 현장 몇 시까지입니까?"],["2021.04.08 18:14","최요원","8시. 장비 꼭 챙겨."],["2021.04.08 18:15","박도현","알겠습니다!"],["2021.04.10 21:04","최요원","미안"]]},{"id":"number2","name":"알 수 없는 연락처","group":"알 수 없는 연락처","messages":[["2018.03.12 16:11","선배님","최요원. 자료 확인했나?"],["2018.03.12 16:15","최요원","네 선배님."],["2018.03.12 16:16","선배님","내일 오전까지 보내."],["2018.03.12 16:17","최요원","알겠습니다."], 2","name":"010-9163-2574","group":"저장되지 않은 번호","messages":[["2024.09.05 14:30","최요원","안녕하세요. 그날 일은 잘 마무리됐습니다~ 다만 기억 소거 절차를 진행해야 해서 환경부 본사에 한번 들러 주셔야 해요. 오시기 전에 편하게 연락 주십시오."]]},{"id":"memory3","name":"010-6532-8190","group":"저장되지 않은 번호","messages":[["2025.10.22 10:20","최요원","안녕하세요~ 혹시 기억 소거 절차 아직 안 받으셨지요? 번거로우시겠지만 환경부 본사로 와 주셔야 합니다. 오시면 제가 안내해 드릴게요."]]},{"id":"ringpromo","name":"루미에르 주얼리","group":"광고 안내","messages":[["2025.09.18 10:24","루미에르 주얼리","[광고] 루미에르 주얼리 연말 커플링·기념일 반지 최대 25% 혜택. 수신거부 080-000-0000"],["2025.11.07 09:00","루미에르 주얼리","[안내] 새로운 알림이 도착했습니다."],["2025.11.14 11:04","루미에르 주얼리","[광고] 발렌타인데이 선물 추천. 심플한 실버 링부터 커플링까지."],["2026.02.12 09:02","루미에르 주얼리","[광고] 봄맞이 반지 컬렉션 출시. 신규 회원 할인 쿠폰이 도착했습니다."],["2026.03.31 11:24","루미에르 주얼리","[광고] 오래 기억하고 싶은 사람에게. 커플링·기념일 반지 봄 시즌 특별 혜택 안내. 수신거부 080-000-0000"]]},{"id":"delivery","name":"택배 배송안내","group":"배송 알림","messages":[["2025.09.18 08:42","택배 배송안내","[배송안내] 주문하신 상품이 배송 출발했습니다."],["2025.10.23 16:19","택배 배송안내","[배송완료] 고객님의 택배가 문 앞에 배송되었습니다."],["2025.12.11 10:06","택배 배송안내","[배송안내] 배송 예정 상품이 오늘 도착할 예정입니다."],["2026.01.16 18:31","택배 배송안내","[배송완료] 택배가 배송 완료되었습니다."],["2026.03.19 12:08","택배 배송안내","[배송안내] 고객님의 상품이 배송 중입니다. 배송조회는 앱에서 확인하세요."]]},{"id":"safety","name":"재난안전문자","group":"안전 안내","messages":[["2025.09.18 06:42","재난안전문자","[안전안내문자] 강풍으로 인한 낙하물 및 시설물 안전사고에 유의하시기 바랍니다."],["2025.11.14 13:11","재난안전문자","[안전안내문자] 건조한 날씨가 이어지고 있습니다. 산불 예방에 주의 바랍니다."],["2026.02.12 10:32","재난안전문자","[안전안내문자] 봄철 산불 및 야외활동 안전사고에 주의하시기 바랍니다."]]},{"id":"shopping","name":"모노스토어","group":"쇼핑 알림","messages":[["2025.09.18 12:30","모노스토어","[광고] 장바구니에 담아둔 상품이 할인 중입니다."],["2025.11.07 09:00","모노스토어","[안내] 새로운 알림이 도착했습니다."],["2026.01.16 08:13","모노스토어","[광고] 주말 한정 무료배송 쿠폰이 발급되었습니다."]]},{"id":"coffee","name":"커피빈클럽","group":"멤버십 알림","messages":[["2025.09.18 07:44","커피빈클럽","[광고] 이번 주 커피 할인 쿠폰이 도착했어요."],["2026.01.16 12:14","커피빈클럽","[광고] 아이스 바닐라 라떼 구매 시 포인트 2배 적립."]]},{"id":"payment","name":"카드 이용 알림","group":"결제 안내","messages":[["2025.09.18 18:21","카드 이용 알림","[결제안내] 카드 let currentConversation=null;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
let lowBatteryShown=false;
function unlock(){show('home');if(!lowBatteryShown){lowBatteryShown=true;setTimeout(showLowBattery,450)}}
function closeLowBattery(){const p=document.getElementById("lowBatteryPopup");if(p)p.remove()}
function showLowBattery(){const shade=document.createElement('div');shade.id='lowBatteryPopup';shade.className='battery-shade';shade.innerHTML='<div class="battery-dialog"><div style="font-size:28px;margin-bottom:10px">🪫</div><h3>배터리 잔량이 부족합니다</h3><p>배터리가 3% 남았습니다.<br>충전기를 연결하세요.</p><button class="action" onclick="closeLowBattery()">확인</button></div>';$('phone').append(shade)}
function goHome(){document.querySelectorAll('.phone-bottom-tabs').forEach(x=>x.remove());stopVoice();closeFile();currentConversation=null;show('home')}
function back(){document.querySelectorAll('.phone-bottom-tabs').forEach(x=>x.remove());stopVoice();if($('mysteryFile')){closeFile();return}if(currentConversation){currentConversation=null;openApp('메시지')}else goHome()}
function updateTime(){const d=new Date();const t=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});['statusTime','lockTime','homeTime'].forEach(id=>$(id).textContent=t);if($('clockNow'))$('clockNow').textContent=d.toLocaleTimeString('ko-KR',{hour12:false})}
updateTime();setInterval(updateTime,1000);
const canvas=$('pattern'),ctx=canvas.getContext('2d'),dots=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)dots.push({x:45+c*65,y:45+r*65});let selected=[],drawing=false;
function drawPattern(){ctx.clearRect(0,0,220,220);if(selected.length>1){ctx.beginPath();ctx.moveTo(dots[selected[0]].x,dots[selected[0]].y);selected.slice(1).forEach(i=>ctx.lineTo(dots[i].x,dots[i].y));ctx.strokeStyle='#a7d3ff';ctx.lineWidth=4;ctx.stroke()}dots.forEach((d,i)=>{ctx.beginPath();ctx.arc(d.x,d.y,selected.includes(i)?12:7,0,Math.PI*2);ctx.fillStyle=selected.includes(i)?'#a7d3ff':'#fff';ctx.fill()})}
function addDot(e){const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*220/rect.width,y=(e.clientY-rect.top)*220/rect.height;dots.forEach((d,i)=>{if(Math.hypot(x-d.x,y-d.y)<24&&!selected.includes(i)){selected.push(i);drawPattern()}})}
canvas.addEventListener('pointerdown',e=>{document.querySelector('.pattern-title').textContent='완료되면 손가락을 떼세요';drawing=true;selected=[];canvas.setPointerCapture(e.pointerId);addDot(e)});canvas.addEventListener('pointermove',e=>{if(drawing)addDot(e)});canvas.addEventListener('pointerup',()=>{drawing=false;document.querySelector('.pattern-title').textContent='패턴을 그려 잠금 해제';if(selected.length)setTimeout(unlock,250)});canvas.addEventListener('pointercancel',()=>{drawing=false;document.querySelector('.pattern-title').textContent='패턴을 그려 잠금 해제'});drawPattern();
function getSavedMessages(id){try{return JSON.parse(localStorage.getItem('chat_'+id)||'[]')}catch(e){return []}}
function getAllMessages(chat){return [...chat.messages,...getSavedMessages(chat.id)].filter(m=>!(chat.id==='ryu'&&(/재관아\s*넌\s*너무\s*나쁜\s*남자|재관아넌너무나쁜남자야|나쁜\s*남자/.test(m[2]))))}
const portalArticles=[{"date":"2026.03.18","tag":"사회","title":"폐쇄된 상가에서 연락 끊긴 시민 4명, 수색 끝에 무사 구조","desc":"서울 외곽의 폐쇄된 상가 건물에 들어간 뒤 연락이 끊겼던 시민 네 명이 관계 기관의 합동 수색 끝에 모두 구조됐다. 신고를 접수한 당국은 건물 출입을 통제하고 마지막 목격 장소를 중심으로 내부 수색을 진행했다.","body":["서울 외곽의 폐쇄된 상가 건물에 들어간 뒤 연락이 끊겼던 시민 네 명이 관계 기관의 합동 수색 끝에 모두 구조됐다. 신고를 접수한 당국은 건물 출입을 통제하고 마지막 목격 장소를 중심으로 내부 수색을 진행했다.","현장에는 오랫동안 사용되지 않은 계단과 연결 통로가 남아 있어 수색에 어려움이 있었던 것으로 알려졌다. 관계자는 건물 내부 구조가 복잡하고 일부 구역의 조명이 작동하지 않아 안전 확보에 시간이 걸렸다고 설명했다.","구조된 시민들은 건강 상태를 확인한 뒤 가족에게 인계됐다. 이들은 발견 당시 상황을 자세히 기억하지 못하는 것으로 전해졌으나, 관계 당국은 극심한 피로와 현장 혼란이 영향을 미쳤을 가능성을 열어 두고 있다.","관할 기관은 무단 출입을 막기 위한 임시 안전시설을 설치하고 정확한 출입 경위와 시설 관리 실태를 확인할 예정이다. 구조에 참여한 인력의 구체적인 소속과 수색 동선은 공개되지 않았다."],"source":"서울지역신문"},{"date":"2026.02.06","tag":"사회","title":"야간 산책 중 실종된 주민, 합동 수색으로 귀가","desc":"저녁 산책을 나간 뒤 귀가하지 않은 주민이 신고 접수 다음 날 새벽 무사히 발견됐다. 경찰과 관계 기관은 인근 폐쇄회로(CC)TV 영상과 휴대전화의 마지막 확인 위치를 토대로 수색 범위를 좁혔다.","body":["저녁 산책을 나간 뒤 귀가하지 않은 주민이 신고 접수 다음 날 새벽 무사히 발견됐다. 경찰과 관계 기관은 인근 폐쇄회로(CC)TV 영상과 휴대전화의 마지막 확인 위치를 토대로 수색 범위를 좁혔다.","주민이 발견된 장소는 평소 산책 경로와 다소 떨어진 곳으로, 일부 구간은 야간 조명이 부족한 것으로 조사됐다. 수색 당국은 주변 탐방로와 출입 제한 구역을 함께 확인했다.","발견된 주민은 큰 외상 없이 가족에게 돌아갔으며, 이동 경위에 관해서는 기억이 명확하지 않다고 진술한 것으로 알려졌다. 당국은 개인정보 보호를 이유로 추가 진술 내용은 공개하지 않았다.","지자체는 해당 구간의 야간 안내 표지와 안전 조명을 점검하고, 늦은 시간 홀로 이동할 경우 주변인에게 이동 경로를 알릴 것을 당부했다."],"source":"지역종합뉴스"},{"date":"2025.12.29","tag":"사회","title":"산장 인근 실종 신고 관련 수색 종료…실종자 전원 발견","desc":"산장 인근에서 발생한 실종 신고와 관련해 관계 기관이 수색을 마무리했다고 밝혔다. 신고된 인원은 모두 발견됐으며, 현재 추가 실종자는 없는 것으로 파악됐다.","body":["산장 인근에서 발생한 실종 신고와 관련해 관계 기관이 수색을 마무리했다고 밝혔다. 신고된 인원은 모두 발견됐으며, 현재 추가 실종자는 없는 것으로 파악됐다.","수색은 산장 주변 산책로와 사용이 중단된 부속 시설을 중심으로 이뤄졌다. 현장 관계자들은 통행이 드문 구역에 대한 확인이 필요해 수색 시간이 예상보다 길어졌다고 설명했다.","일부 목격자 사이에서는 당시 현장 상황을 둘러싼 진술이 엇갈렸으나, 당국은 확인되지 않은 정보의 확산을 경계해 달라고 요청했다. 실종자들은 건강 상태를 확인받은 뒤 귀가 조치됐다.","산장 운영 측은 당분간 일부 탐방로를 폐쇄하고 안내 표지와 비상 연락 체계를 정비할 계획이다. 당국은 수색 인력의 세부 배치 현황은 밝히지 않았다."],"source":"오늘의 뉴스"},{"date":"2025.09.12","tag":"사회","title":"지하 통로에서 사라진 방문객 2명 구조…출입 통제","desc":"도심 지하 연결 통로에서 행방이 확인되지 않던 방문객 두 명이 수색 끝에 발견됐다. 신고를 받은 관계 기관은 인근 출입구를 통제하고 건물 관리 인력과 함께 통로 내부를 확인했다.","body":["도심 지하 연결 통로에서 행방이 확인되지 않던 방문객 두 명이 수색 끝에 발견됐다. 신고를 받은 관계 기관은 인근 출입구를 통제하고 건물 관리 인력과 함께 통로 내부를 확인했다.","해당 통로는 여러 건물의 지하층을 연결하는 구조로, 일부 구간에는 안내 표지가 부족했던 것으로 파악됐다. 방문객들이 정확히 어느 경로로 이동했는지는 추가 확인이 필요한 상황이다.","구조된 두 사람은 현장에서 기본적인 건강 확인을 받은 뒤 귀가했다. 당국은 수색 당시 확인된 시설물 상태와 출입 기록을 검토하고 있다고 밝혔다.","시설 관리자는 비상구 표시를 보완하고 출입 제한 구역의 잠금장치를 점검하겠다고 전했다. 해당 구간은 안전 점검이 끝날 때까지 일반인의 통행이 제한된다."],"source":"재난안전뉴스"},{"date":"2024.08.10","tag":"사회","title":"해안 산책로 실종 관광객, 밤샘 수색 끝 구조","desc":"해안 산책로에서 일행과 떨어진 뒤 연락이 두절된 관광객이 밤샘 수색 끝에 구조됐다. 관광객의 일행은 예정된 시간에도 숙소로 돌아오지 않자 관계 기관에 신고했다.","body":["해안 산책로에서 일행과 떨어진 뒤 연락이 두절된 관광객이 밤샘 수색 끝에 구조됐다. 관광객의 일행은 예정된 시간에도 숙소로 돌아오지 않자 관계 기관에 신고했다.","수색 당국은 해안 산책로와 주변 숲길을 나누어 확인했으며, 새벽 시간 관광객을 발견해 안전한 장소로 이동시켰다. 당시 해안가에는 짙은 안개가 끼어 시야 확보가 쉽지 않았던 것으로 전해졌다.","관광객은 구조 관계자에게 감사의 뜻을 전했다. 당국은 정확한 이동 경로를 확인하는 한편 산책로 안내 표지의 가시성을 점검할 계획이다.","관계자는 낯선 지역의 산책로를 이용할 때에는 일행과 이동 계획을 공유하고, 출입 통제 표지를 반드시 확인해 달라고 당부했다."],"source":"동해일보"},{"date":"2023.10.07","tag":"사회","title":"도심 재개발 구역 실종 신고 잇따라…합동 수색 마무리","desc":"재개발 구역 인근에서 잇따라 접수된 실종 신고와 관련해 관계 기관이 합동 수색을 종료했다. 신고 대상자들의 소재가 모두 확인되면서 현장에 내려졌던 임시 통제도 일부 해제됐다.","body":["재개발 구역 인근에서 잇따라 접수된 실종 신고와 관련해 관계 기관이 합동 수색을 종료했다. 신고 대상자들의 소재가 모두 확인되면서 현장에 내려졌던 임시 통제도 일부 해제됐다.","수색 당국은 철거 예정 건물과 지하 연결 시설을 중심으로 출입 기록과 목격 정보를 확인했다. 현장에는 폐쇄된 출입구가 많아 이동 경로를 추적하는 데 시간이 걸린 것으로 알려졌다.","발견된 시민들은 필요한 건강 확인을 받았으며, 구체적인 발견 장소는 안전상의 이유로 공개되지 않았다. 당국은 현장과 관련된 미확인 소문에 대해 신중한 접근을 요청했다.","구청은 남은 철거 구역의 출입 통제를 강화하고 야간 순찰을 확대할 방침이다. 추가 신고가 접수되면 관계 기관과 협조해 대응할 계획이라고 밝혔다."],"source":"서울일보"}];
function renderInternet(){
 const body=$('appBody');body.replaceChildren();
 const bar=document.createElement('div');bar.className='web-search';bar.innerHTML='<span>🌐</span><input id="webSearch" placeholder="검색 또는 주소 입력" aria-label="검색어">';
 const go=document.createElement('button');go.textContent='검색';go.onclick=()=>filterInternet();bar.append(go);body.append(bar);
 const label=document.createElement('p');label.className='small';label.textContent='자주 방문한 사이트';body.append(label);
 const shortcuts=document.createElement('div');shortcuts.className='web-shortcuts';
 [['ministry','환경부','https://www.me.go.kr/'],['◈','초자연재난관리국','#agency']].forEach(([icon,name,url])=>{const btn=document.createElement('button');btn.className='web-shortcut';btn.innerHTML=(icon==='ministry'?'<span class="ministry-mark"><svg viewBox="0 0 48 48" width="29" height="29" aria-hidden="true"><path d="M9 34C12 17 24 11 38 9c-2 15-11 27-26 27" fill="none" stroke="#63b995" stroke-width="5" stroke-linecap="round"/><path d="M13 35c7-10 14-16 24-22" fill="none" stroke="#b9e6d2" stroke-width="3" stroke-linecap="round"/></svg></span>':'<span>'+icon+'</span>')+'<strong>'+name+'</strong>';btn.onclick=()=>{if(url.startsWith('#'))showAgencyPortal();else window.open(url,'_blank','noopener,noreferrer')};shortcuts.append(btn)});
 body.append(shortcuts);
 const heading=document.createElement('h3');heading.textContent='최근 기사';body.append(heading);
 const articles=document.createElement('div');articles.id='webArticles';body.append(articles);filterInternet();
 $('webSearch').addEventListener('keydown',e=>{if(e.key==='Enter')filterInternet()});
}
function filterInternet(){const el=$('webArticles');if(!el)return;el.replaceChildren();const q=($('webSearch')?.value||'').trim().toLowerCase();const found=portalArticles.filter(a=>(a.title+' '+a.desc+' '+a.tag).toLowerCase().includes(q));if(!found.length){el.innerHTML='<div class="card">일치하는 기사가 없습니다.</div>';return}found.forEach(a=>{const card=document.createElement('button');card.className='web-article';card.innerHTML='<span class="web-meta"></span><strong></strong><p></p>';card.querySelector('.web-meta').textContent=a.source+' · '+a.date+' · '+a.tag;card.querySelector('strong').textContent=a.title;card.querySelector('p').textContent=a.desc;const thumb=document.createElement('img');thumb.src=a.photo;thumb.className='news-thumbnail';thumb.alt='현장 자료 사진';card.insertBefore(thumb,card.querySelector('p'));card.onclick=()=>showArticle(a);el.append(card)})}
function showArticle(a){
 const body=$('appBody');body.replaceChildren();
 const b=document.createElement('button');b.className='back';b.textContent='‹';b.onclick=renderInternet;
 const meta=document.createElement('p');meta.className='small';meta.textContent=a.source+' · '+a.date+' · 사회';
 const h=document.createElement('h2');h.textContent=a.title;h.style.lineHeight='1.45';
 const sub=document.createElement('p');sub.className='small';sub.textContent='입력 '+a.date+' '+a.time+'  |  '+a.reporter+'  |  사회부';
 body.append(b,meta,h,sub);
 const rule=document.createElement('hr');rule.style.cssText='border:0;border-top:1px solid #334155;margin:16px 0';body.append(rule);const figure=document.createElement('figure');figure.className='news-figure';const photo=document.createElement('img');photo.src=a.photo;photo.alt='사건 현장 자료 사진';const cap=document.createElement('figcaption');cap.textContent='현장 자료 사진. 관계 기관 제공 · 기사 이해를 돕기 위한 재구성 이미지';figure.append(photo,cap);body.append(figure);
 (a.body||[a.desc]).forEach((paragraph,i)=>{const p=document.createElement('p');p.className='article-paragraph';p.textContent=paragraph;body.append(p)});
 const foot=document.createElement('p');foot.className='small';foot.textContent='※ 세계관 속 가상 기사입니다.';body.append(foot);
}
function showAgencyPortal(){const body=$('appBody');body.replaceChildren();const b=document.createElement('button');b.className='back';b.textContent='‹';b.onclick=renderInternet;const panel=document.createElement('div');panel.className='card';panel.innerHTML='<h2>◈ 초자연재난관리국</h2><p class="small">내부망 바로가기</p><p>접근 권한을 확인할 수 없습니다.</p><p class="small">공개망에서는 관련 자료를 열람할 수 없습니다.</p>';body.append(b,panel)}

function isMineMessage(chat,sender){return sender==='최요원'||(sender==='이강헌'&&['yeji','jiwoo'].includes(chat.id))}
const initialUnreadTargets={"haegeum":5,"agency":10,"hospital":2,"funeral":3,"gom":2,"friend":1,"citizen1":1,"citizen2":1,"citizen3":1,"ringpromo":4,"delivery":4,"safety":3,"shopping":3,"coffee":2,"payment":3,"market":3};
function unreadCount(chat){
 if(chat.id==='funeral')return 0;
 const all=getAllMessages(chat);
 const readIndex=localStorage.getItem('phone_read_v2_'+chat.id);
 if(readIndex!==null)return all.slice(Number(readIndex)).filter(m=>!isMineMessage(chat,m[1])).length;
 return initialUnreadTargets[chat.id]||0;
}
function markConversationRead(chat){localStorage.setItem('phone_read_v2_'+chat.id,String(getAllMessages(chat).length))}
function renderConversationList(){updateUnreadTotal();const body=$('appBody');body.replaceChildren();const sorted=[...conversations].sort((a,b)=>(getAllMessages(b).at(-1)?.[0]||'').localeCompare(getAllMessages(a).at(-1)?.[0]||''));sorted.forEach(chat=>{const last=getAllMessages(chat).at(-1),item=document.createElement('button');item.className='chat-item';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=chat.name[0];const info=document.createElement('div');info.className='chat-info';const title=document.createElement('div');title.className='chat-name';title.textContent=chat.name;const preview=document.createElement('div');preview.className='chat-preview';preview.textContent=last?last[2]:'';const date=document.createElement('div');date.className='chat-date';date.textContent=last?last[0].split(' ')[0]:'';const count=unreadCount(chat);const meta=document.createElement('div');meta.className='chat-meta';meta.append(date);if(count){const badge=document.createElement('span');badge.className='unread-badge';badge.textContent=count>99?'99+':String(count);meta.append(badge)}info.append(title,preview);item.append(avatar,info,meta);item.onclick=()=>openConversation(chat.id);body.append(item)})}
function openConversation(id){currentConversation=conversations.find(c=>c.id===id);if(!currentConversation)return;markConversationRead(currentConversation);$('appTitle').textContent=currentConversation.name;const body=$('appBody');body.replaceChildren();const group=document.createElement('p');group.className='small';group.textContent=currentConversation.group;const history=document.createElement('div');history.id='chatHistory';const composer=document.createElement('div');composer.className='composer';const input=document.createElement('input');input.id='newChatMessage';input.placeholder='메시지 입력';if(id==='haegeum'&&memoViewedForHaegeum){input.value='누님, 이쪽으로는 오지 마세요.';memoViewedForHaegeum=false;}const send=document.createElement('button');send.textContent='전송';send.onclick=sendChatMessage;composer.append(input,send);body.append(group,history,composer);renderChatHistory();requestAnimationFrame(()=>{$('appScreen').scrollTop=$('appScreen').scrollHeight})}
function renderChatHistory(){const history=$('chatHistory');if(!history||!currentConversation)return;history.replaceChildren();let prev='';[...getAllMessages(currentConversation)].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([datetime,sender,text])=>{const [date,time]=datetime.split(' ');if(date!==prev){const sep=document.createElement('div');sep.className='day-separator';sep.textContent=date;history.append(sep);prev=date}const mine=sender==='최요원'||(sender==='이강헌'&&['yeji','jiwoo'].includes(currentConversation.id)),row=document.createElement('div');row.className='message-row'+(mine?' mine':'');if(!mine){const label=document.createElement('div');label.className='sender';label.textContent=sender;row.append(label)}const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;const stamp=document.createElement('div');stamp.className='timestamp';stamp.textContent=time||'';row.append(bubble,stamp);history.append(row)})}
function sendChatMessage(){if(!currentConversation)return;const input=$('newChatMessage'),text=input.value.trim();if(!text)return;const d=new Date(),date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('.'),time=[String(d.getHours()).padStart(2,'0'),String(d.getMinutes()).padStart(2,'0')].join(':');const key='chat_'+currentConversation.id,saved=getSavedMessages(currentConversation.id);saved.push([date+' '+time,'최요원',text]);localStorage.setItem(key,JSON.stringify(saved));input.value='';renderChatHistory();requestAnimationFrame(()=>{$('appScreen').scrollTop=$('appScreen').scrollHeight})}
function makeItem(title,subtitle,callback){const item=document.createElement('button');item.className='chat-item';const av=document.createElement('div');av.className='avatar';av.textContent=title[0];const info=document.createElement('div');info.className='chat-info';const n=document.createElement('div');n.className='chat-name';n.textContent=title;const sub=document.createElement('div');sub.className='chat-preview';sub.textContent=subtitle;info.append(n,sub);item.append(av,info);if(callback)item.onclick=callback;return item}
function renderContacts(){const body=$('appBody');body.replaceChildren();conversations.forEach(chat=>body.append(makeItem(chat.name,chat.group,()=>openConversation(chat.id))))}

function voiceLog(line){const el=$('voiceLog');if(el){el.textContent+=(el.textContent?'\n\n':'')+line;el.scrollTop=el.scrollHeight}}
function waitVoice(ms,token){return Promise.resolve(token===voiceToken)}
function speakVoice(text,token){return Promise.resolve()}
function makeSound(kind){return;

 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  audioCtx=audioCtx||new C();audioCtx.resume();const now=audioCtx.currentTime;
  const beep=(f,start,dur,vol=.11,type='sine')=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,now+start);g.gain.setValueAtTime(vol,now+start);g.gain.exponentialRampToValueAtTime(.001,now+start+dur);o.connect(g);g.connect(audioCtx.destination);o.start(now+start);o.stop(now+start+dur)};
  if(kind==='door'){
   beep(160,0,.22,.12,'sawtooth');beep(95,.15,.45,.15,'triangle');beep(55,.55,.23,.18,'sawtooth');
  }else if(kind==='jingle'){
   [392,494,587,784,587,784].forEach((f,i)=>beep(f,i*.17,.24,.09,'triangle'));
  }else{
   [80,950,130,740,65,1100,190,450,90,1400,100,280].forEach((f,i)=>beep(f,i*.11,.22,.055,i%2?'sawtooth':'triangle'));
  }
 }catch(e){}
}
function stopVoice(){voiceToken++;voiceRunning=false;if('speechSynthesis' in window)speechSynthesis.cancel();}
async function playVoice(){
 stopVoice();const token=voiceToken;voiceRunning=true;const log=$('voiceLog');if(log)log.textContent='';
 const intro='2026년 4월 4일 오전 3시 47분에 기록된 음성 메시지입니다.';
 voiceLog(intro);await speakVoice(intro,token);if(token!==voiceToken)return;
 for(const part of voiceSegments){
  if(token!==voiceToken)return;
  if(part.kind==='speech'){voiceLog(part.text);await speakVoice(part.text,token)}
  else if(part.kind==='pause'){voiceLog('[정적]');await waitVoice(part.duration,token)}
  else {const label={door:'[문이 열렸다 닫히는 소리]',jingle:'[럭키마트 로고송이 울리기 시작한다]',distortion:'[여러 겹의 낯선 소음이 겹친다]'}[part.kind];voiceLog(label);makeSound(part.kind);await waitVoice(part.kind==='jingle'?1300:part.kind==='distortion'?1600:800,token)}
 }
 if(token===voiceToken){voiceLog('[메시지가 종료되었습니다.]');voiceRunning=false}
}

function renderCalendar(){
 const body=$('appBody');body.replaceChildren();
 const top=document.createElement('div');top.className='calendar-toolbar';
 const prev=document.createElement('button');prev.textContent='‹';prev.setAttribute('aria-label','이전 달');prev.onclick=()=>changeCalendarMonth(-1);
 const title=document.createElement('strong');title.textContent=calendarYear+'년 '+calendarMonth+'월';
 const next=document.createElement('button');next.textContent='›';next.setAttribute('aria-label','다음 달');next.onclick=()=>changeCalendarMonth(1);
 top.append(prev,title,next);body.append(top);
 const grid=document.createElement('div');grid.className='calendar-grid';
 ['일','월','화','수','목','금','토'].forEach((d,i)=>{const el=document.createElement('div');el.className='calendar-weekday'+(i===0?' sunday':'');el.textContent=d;grid.append(el)});
 const offset=new Date(calendarYear,calendarMonth-1,1).getDay();
 const days=new Date(calendarYear,calendarMonth,0).getDate();
 for(let i=0;i<offset;i++){const blank=document.createElement('div');blank.className='calendar-empty';grid.append(blank)}
 for(let day=1;day<=days;day++){
  const date=calendarYear+'-'+String(calendarMonth).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  const btn=document.createElement('button');btn.className='calendar-day'+(day===calendarSelected?' selected':'')+(calendarEvents[date]?' has-event':'')+(calendarYear===2026&&calendarMonth===4&&day===4?' story-day':'');
  btn.innerHTML='<span>'+day+'</span>'+(calendarEvents[date]?'<i></i>':'');
  btn.onclick=()=>{calendarSelected=day;renderCalendar()};grid.append(btn)
 }
 body.append(grid);
 const selected=calendarYear+'-'+String(calendarMonth).padStart(2,'0')+'-'+String(calendarSelected).padStart(2,'0');
 const panel=document.createElement('div');panel.className='calendar-agenda';
 const head=document.createElement('strong');head.textContent=calendarMonth+'월 '+calendarSelected+'일 일정';panel.append(head);
 const events=[...(calendarEvents[selected]||[])];
 const custom=JSON.parse(localStorage.getItem('phone_calendar_custom')||'{}');
 if(custom[selected])events.push(...custom[selected]);
 if(!events.length){const empty=document.createElement('p');empty.className='small';empty.textContent='등록된 일정이 없습니다.';panel.append(empty)}
 else events.forEach(t=>{const row=document.createElement('div');row.className='calendar-event';row.textContent=t;panel.append(row)});

 panel.append(input,add);body.append(panel);
}

function musicVideoId(raw){
 const v=raw.trim();if(/^[A-Za-z0-9_-]{11}$/.test(v))return v;
 try{const u=new URL(v);const h=u.hostname.toLowerCase();if(h==='youtu.be'||h==='www.youtu.be')return (u.pathname.split('/')[1]||'').match(/^[A-Za-z0-9_-]{11}$/)?.[0]||'';
 if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(h)){const id=u.searchParams.get('v')||u.pathname.match(/^\/(?:embed|shorts|live)\/([A-Za-z0-9_-]{11})/)?.[1]||'';return /^[A-Za-z0-9_-]{11}$/.test(id)?id:''}}
 catch(e){}return '';
}
